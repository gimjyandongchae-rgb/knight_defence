$('tn').onclick=()=>{resetVB();xView('n')};$('te').onclick=()=>{resetVB();xView('e')};
const DC=['기사만 사용 가능','설치 제한 20마리','모든 몹 체력 1.3배','타워 공격속도 20% 감소','몹 이동속도 1.25배 · 처치 코인 2배','모든 보스 체력 1.4배','처치 코인 60%'];
let DS={};try{DS=JSON.parse(localStorage.getItem('tddaily')||'{}')}catch(e){}
function dailyInfo(){const d=new Date(),key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),n=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5),i1=n%7,i2=(i1+1+Math.floor(n/7)%6)%7;return{key,map:n%3,m:[i1,i2]}}
function dailyDone(){if(!DAILY||DS.done===dailyInfo().key)return 0;DS.done=dailyInfo().key;try{localStorage.setItem('tddaily',JSON.stringify(DS))}catch(e){}SKS.pn+=5;saveSK();return 5}
function dailyText(){const di=dailyInfo();return '📅 '+di.key+' · 맵: '+MAPS[di.map].n+'\n조건: '+di.m.map(i=>DC[i]).join(' / ')+'\n목표 20웨이브 클리어 · 보상 스킬 포인트 +5'}

function awardRun(){if(runAwarded||!started)return 0;runAwarded=true;const base=Math.floor(wave/5)+bk+(won?3:0),p=ENDLESS?base:Math.ceil(base*[.5,1,1.5][DIF]);if(p>0){if(ENDLESS)SKS.pe+=p;else SKS.pn+=p;saveSK()}return p}
function drawLobby(){if(!inLobby)return;const lt=performance.now()/1000,sT=T,og=g;T=lt;
 for(const[id,kind]of[['lcL',0],['lcR',1]]){const c=$(id);if(!c.width)continue;g=c.getContext('2d');g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,c.width,c.height);g.translate(c.width/2,c.height-110);
  if(kind==0){g.scale(3.4,3.4);const w=lt%6;drawOrc({fp:[0,0],wind:w<1?1-w:0,hp:1,mx:1})}else{g.scale(7,7);const p=lt%1.6;drawKnight({x:0,y:0,l:2,sw:p<.2?.2-p:0,face:-1})}}
 g=og;T=sT}
